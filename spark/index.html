<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looka | Share my lighter</title>
<meta name="description" content="Open and spark my Zippo. The fuel is a communal reservoir that anyone can refill." />
<link rel="preload" as="fetch" href="https://octothorp.es/?uri=https://looka.click/weirdweboctober26/spark">
<link rel="octo:octothorpes" href="Spark">
<script src="https://octothorp.es/linkfill.js"></script>
<style>
  body {
    box-sizing: border-box;
    margin: 0;
    font-family: monospace;
    background: #111;
    color: #eee;
    padding: 2rem;
    min-height: 100vh; /* so there's room to center within, not just
      the content's own height */
    display: flex;
    flex-direction: column;
    align-items: center; /* centers each child as a block; #lighterRow
      keeps its own internal flex-row layout (lighter + fuel side by side) */
    justify-content: center; /* vertical centering */
    text-align: center;
  }
  button { font-size: 1rem; padding: 0.6rem 1.2rem; margin-right: 0.5rem; margin-bottom: 1rem; cursor: pointer; }
  pre { background: #000; color: #0f0; padding: 1rem; border-radius: 6px; max-width: 500px; white-space: pre-wrap; }
  input { font-family: monospace; padding: 0.3rem; width: 320px; }

  #lighter {
    position: relative;
    width: min(480px, 90vw);
    aspect-ratio: 2476 / 2556; /* shared canvas for every layer below */
    margin: 2rem 0;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none; /* iOS: no long-press callout/menu */
  }
  #lighter img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none; /* stop the native "pick up and drag this
      image" ghost — it would otherwise fight the wheel's swipe gesture */
    /* user-drag: none; */
  }
  /* body: always visible, bottom of the stack */
  #bodyImg { z-index: 1; }
  /* hinge: hidden while closed, revealed partway through opening/closing
     (see hinge-reveal-* keyframes) — it's covered by the lid until the
     lid's lifted enough to expose it. */
  #hingeImg { z-index: 2; opacity: 0; }
  /* flame: only shown while lit, flickering between 3 frames */
  #flameImg { z-index: 3; display: none; }
  /* lid: always on top, swings between closed/open via transform only
     (never fades — see lid-swing-* keyframes below) */
  #lidImg {
    z-index: 10;
    transform-origin: 52.2213% 57.9812%; /* the real hinge: lid_close.png's
      bottom-left corner, from its alpha bounding box — stays (relatively)
      fixed while the lid rotates around it */
  }
  /* Base translate derived by rotating lid_close.png -170deg about the
     hinge in Python and measuring the bbox center vs. close_target.svg's
     center; nudged slightly lower/left from there by eye. */
  @keyframes lid-swing-open {
    from { transform: translate(0%, 0%) rotate(0deg); }
    to   { transform: translate(1.9%, -1.5%) rotate(-170deg); }
  }
  @keyframes lid-swing-close {
    from { transform: translate(1.9%, -1.5%) rotate(-170deg); }
    to   { transform: translate(0%, 0%) rotate(0deg); }
  }
  /* Instant show/hide, not a fade: a 0.1%-wide gap (not the exact same
     percentage twice — some browsers silently drop an exact duplicate
     and ease-interpolate across the whole range instead) makes the jump
     effectively instant without relying on duplicate-keyframe handling. */
  @keyframes hinge-reveal-open {
    0%    { opacity: 0; }
    39.9% { opacity: 0; }
    40%   { opacity: 1; }
    100%  { opacity: 1; }
  }
  @keyframes hinge-reveal-close {
    0%    { opacity: 1; }
    49.9% { opacity: 1; }
    50%   { opacity: 0; }
    100%  { opacity: 0; }
  }

  /* Hotspots: invisible SVG shapes overlaid at the same canvas size so
     they scale with the art regardless of display size. */
  .hotspot-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 20; /* above the lid so clicks always land */
  }
  .hotspot-overlay rect,
  .hotspot-overlay path {
    /* Safari doesn't reliably hit-test fill:transparent as "painted" —
       clicks fall through to the plain <svg> box behind it. A fill
       that's technically nonzero (if visually indistinguishable from
       transparent) hit-tests correctly everywhere. */
    fill: rgba(0, 0, 0, 0.01);
    cursor: pointer;
  }
  #wheelTarget { touch-action: none; } /* don't let a swipe scroll the page */

  /* Only the target relevant to the current state is actually
     clickable — openTarget/closeTarget's bounding boxes partly overlap,
     so without this the wrong (but still hit-testable) shape could eat
     a click meant for the other, even though its handler would've
     no-op'd anyway. */
  #closeTarget, #wheelTarget { pointer-events: none; }
  #lighter.is-open #openTarget { pointer-events: none; }
  #lighter.is-open #closeTarget, #lighter.is-open #wheelTarget { pointer-events: all; }

  hr { border: none; border-top: 1px solid #333; margin: 2rem 0; }
  .debug-label { opacity: 0.5; font-size: 0.85rem; }
  .status-note { opacity: 0.6; font-size: 0.85rem; margin: 0.3rem 0; }

  #lighterRow {
    display: flex;
    align-items: flex-start; /* fuelColumn is now taller than #lighter
      (bar matches it, but button + status hang below), so it shouldn't
      be stretched to the row's height */
    gap: 3rem;
  }
  #fuelColumn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    /* no fixed width — sized by its widest child (now the status-note
       text), while #fuelBarWrap below keeps the bar itself narrow */
  }
  /* Wrapper is the thing with overflow:visible — #fuelBar itself needs
     overflow:hidden (to clip the fill's rounded corners), which would
     also clip the indicator label if it lived inside. Height is set in
     JS to match #lighter's actual rendered height exactly; button and
     status note stack below it rather than sharing that height. */
  #fuelBarWrap {
    position: relative;
    width: 1rem;
  }
  #fuelBar {
    position: absolute;
    inset: 0;
    background: #2a2a2a;
    border-radius: 999px;
    overflow: hidden;
    display: flex;
    align-items: flex-end; /* fill grows upward from the bottom */
  }
  #fuelFill {
    width: 100%;
    height: 0%;
    background: linear-gradient(0deg, #7a2a0c, #ff8a3d);
    transition: height 0.3s ease;
  }
  /* The moving label: positioned by `bottom` (set in JS, same % as
     fuelFill's height) and centered on that point via translateY. */
  #fuelIndicator {
    position: absolute;
    left: 0;
    bottom: 0%;
    width: 100%;
    display: flex;
    align-items: center;
    transform: translateY(50%);
    pointer-events: none;
    transition: bottom 0.3s ease;
  }
  #fuelLabel {
    font-family: monospace; /* same as "spark" above, which inherits it
      from body — spans do too, but set explicitly for clarity */
    font-size: 0.7rem;
    opacity: 0.85;
    white-space: nowrap;
    margin-left: 1.6rem; /* clears the bar's width now there's no tick */
  }
  #btnRefillLive {
    /* buttons don't inherit the page font by default in most browsers'
       UA stylesheets — set explicitly to match "spark" above. */
    font-family: monospace;
    font-size: 1rem; /* ≥16px — below that, iOS Safari auto-zooms the
      page on tap to make a focused form control legible */
    padding: 0.4rem 0.9rem;
    background: #7a2a0c; /* bottom of the fuel gradient */
    color: #eee;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s ease;
    /* The real fix for the zoom: iOS's double-tap-to-zoom gesture
       detection can misfire when a tap synchronously changes this
       button's text/disabled state mid-gesture. This disables that
       specific gesture on the button without touching the user's own
       pinch-zoom elsewhere on the page. */
    touch-action: manipulation;
  }
  #btnRefillLive:hover {
    background: #ff8a3d; /* top of the fuel gradient */
    color: #111;
  }
  #btnRefillLive:disabled {
    background: #3a3a3a;
    color: #777;
    cursor: default;
  }
</style>
</head>
<body>
  <script src="../shared/home-button.js"></script>
  <h1 hidden>spark</h1>

  <div id="lighterRow">
  <div id="lighter">
    <img id="bodyImg" src="assets/body.png" alt="lighter body" draggable="false" />
    <img id="hingeImg" src="assets/hinge.png" alt="" draggable="false" />
    <img id="flameImg" src="assets/flame1.png" alt="flame" draggable="false" />
    <img id="lidImg" src="assets/lid_close.png" alt="lid" draggable="false" />

    <!-- All three hotspots share ONE svg box. Three separate <svg>
         wrappers used to each intercept clicks across their FULL canvas
         area regardless of child pointer-events (that was the actual
         bug) — a single wrapper means there's only one box, and child-
         level pointer-events/fill correctly gate which shape responds. -->
    <svg class="hotspot-overlay" viewBox="0 0 2476 2556" preserveAspectRatio="xMidYMid meet">
      <!-- Closed-state target: click to open. From open_target.svg. -->
      <rect id="openTarget" x="1308.98" y="798.041" width="1117.24" height="671.99" transform="rotate(0.358045 1308.98 798.041)" />
      <!-- Open-state target: click to close. From close_target.svg. -->
      <rect id="closeTarget" x="238.318" y="1109" width="1108.22" height="653.375" transform="rotate(16.9448 238.318 1109)" />
      <!-- Flint wheel: press and swipe down to light. Only live once open. -->
      <g clip-path="url(#wheelClip)">
        <path id="wheelTarget" d="M2135.77 1019C2222.61 1019 2293 1087.02 2293 1170.92C2293 1220.95 2267.98 1265.32 2229.37 1293C2228.4 1292.34 2227.38 1291.73 2226.31 1291.19C2225.35 1290.71 2224.37 1290.24 2222.51 1289.45C2222.13 1289.29 2221.68 1289.1 2221.32 1288.95C2220.93 1288.79 2220.55 1288.63 2220.18 1288.47C2219.4 1288.14 2218.79 1287.87 2218.36 1287.67C2218.03 1287.51 2217.93 1287.46 2217.87 1287.42C2217.78 1287.36 2217.49 1287.19 2216.83 1286.72C2215.7 1285.92 2214.52 1285.22 2213.31 1284.62C2213.19 1284.03 2213.06 1283.45 2212.9 1282.87L2212.74 1282.3L2212.48 1281.45C2210.16 1273.91 2206.94 1268.12 2203.98 1263.78C2206.44 1250.68 2208.42 1239.87 2209.85 1231.87C2213.99 1227.37 2217.01 1223.35 2218.59 1221.37C2225.65 1212.54 2230.04 1203.2 2233.2 1193.83C2237.28 1181.71 2236.79 1168.45 2235.8 1159.39C2234.75 1149.71 2232.61 1140.45 2230.52 1134.29C2223.34 1113.08 2210.12 1101.38 2204.4 1095.7C2194.23 1085.57 2190.44 1080.75 2186.09 1075.12C2183.08 1071.22 2179.7 1067.43 2177.39 1064.77C2174.79 1061.78 2173 1059.63 2171.58 1057.61C2162.67 1044.88 2151.61 1037.73 2144.15 1032.47C2137.37 1027.68 2131.53 1023.54 2126.68 1020.42C2126.13 1020.06 2125.57 1019.71 2125 1019.35C2128.56 1019.12 2132.15 1019 2135.77 1019Z" />
      </g>
      <defs>
        <clipPath id="wheelClip"><rect width="2476" height="2556" fill="white"/></clipPath>
      </defs>
    </svg>
  </div>

  <div id="fuelColumn">
    <div id="fuelBarWrap">
      <div id="fuelBar"><div id="fuelFill"></div></div>
      <div id="fuelIndicator">
        <span id="fuelLabel">--%</span>
      </div>
    </div>
    <button id="btnRefillLive">refill lighter fluid</button>
    <p class="status-note">last refilled: <span id="lastRefillText">--</span></p>
    <p class="status-note">lighters burning now: <span id="viewerCountText">1</span><span id="offlineNote" hidden> (currently offline)</span></p>
  </div>
  </div>

  <div id="debugPanel" hidden>
    <hr />
    <p class="debug-label">Debug harness — backend testing until the final UI polish lands.</p>
    <label>Worker URL: <input id="base" value="https://spark-lighter.lookaclick.workers.dev" /></label>
    <div>
      <button id="btnState">refresh state</button>
      <button id="btnLight">light</button>
      <button id="btnExtinguish">extinguish</button>
      <button id="btnRefill">refill</button>
    </div>
    <pre id="out">(no data yet)</pre>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const base = () => $("base").value.replace(/\/$/, "");

    // One random id per page load, sent as ?v= on every request so the
    // Worker can tell how many distinct tabs/visitors are currently
    // around — reuses requests already being made, no extra traffic.
    const viewerId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
    const pageLoadTime = Date.now(); // fallback shown as "last refilled" if it's genuinely never been refilled

    // --- flame flicker: random frame every ~90-170ms while lit ---
    const FLAME_FRAMES = ["assets/flame1.png", "assets/flame2.png", "assets/flame3.png"];
    let flameTimer = null;
    function startFlameFlicker() {
      if (flameTimer) return;
      const img = $("flameImg");
      img.style.display = "block";
      (function tick() {
        let next;
        do {
          next = FLAME_FRAMES[Math.floor(Math.random() * FLAME_FRAMES.length)];
        } while (next === img.getAttribute("src") && FLAME_FRAMES.length > 1);
        img.src = next;
        flameTimer = setTimeout(tick, 90 + Math.random() * 80);
      })();
    }
    function stopFlameFlicker() {
      clearTimeout(flameTimer);
      flameTimer = null;
      $("flameImg").style.display = "none";
    }

    // "#2 SPARK" badge immediately after "weird web october", same
    // font/size. Page-specific — doesn't touch shared/home-button.js,
    // which every other day page also uses as-is.
    function addDayBadge() {
      const homeLink = document.querySelector(".weird-web-home");
      if (!homeLink) return;
      const wrap = document.createElement("div");
      wrap.style.cssText = "position:fixed; top:1rem; left:1rem; display:flex; align-items:baseline; gap:0.5rem; z-index:1000;";
      homeLink.parentNode.insertBefore(wrap, homeLink);
      homeLink.style.position = "static"; // now flows inside wrap instead of its own fixed position
      wrap.appendChild(homeLink);
      const badge = document.createElement("span");
      badge.textContent = "2nd: SPARK";
      badge.style.cssText = 'font-family:"Creepster", cursive; font-size:clamp(1rem, 2.5vw, 1.4rem); color:#eee; letter-spacing:0.02em; opacity:0.85;';
      wrap.appendChild(badge);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", addDayBadge);
    } else {
      addDayBadge();
    }

    // Pin the fuel bar's height to #lighter's actual rendered height
    // (aspect-ratio-driven, so not a fixed CSS value) — button and
    // status note stack below it instead of sharing that height.
    function syncFuelBarHeight() {
      $("fuelBarWrap").style.height = $("lighter").getBoundingClientRect().height + "px";
    }
    syncFuelBarHeight();
    window.addEventListener("resize", syncFuelBarHeight);

    let isOpen = false; // drives which hotspot currently responds

    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    function formatRefillTime(ms) {
      const d = new Date(ms);
      const pad = (n) => String(n).padStart(2, "0");
      // No explicit timeZone given to Intl, so it (like Date's own
      // getters below) defaults to the viewer's own local time zone.
      const tz = new Intl.DateTimeFormat("en-US", { timeZoneName: "short" })
        .formatToParts(d)
        .find((p) => p.type === "timeZoneName").value;
      return `${MONTHS[d.getMonth()]} ${pad(d.getDate())} ${d.getFullYear()}, `
        + `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${tz}`;
    }

    function render(data) {
      $("out").textContent = JSON.stringify(data, null, 2);
      if (data && typeof data.lit === "boolean") {
        // Lit alone isn't enough — open/close is local-only, so a page
        // that loads and syncs lit:true from someone else's earlier
        // action shouldn't show a flame over a still-closed lid.
        if (data.lit && isOpen) startFlameFlicker();
        else stopFlameFlicker();
      }
      // Skipped entirely while a refill animation owns the bar (see
      // btnRefillLive's click handler) — otherwise the 100ms ticker would
      // fight that animation by resetting height back to the real,
      // not-yet-refilled percent on every tick.
      if (data && typeof data.fuelPercent === "number" && !refillPending) {
        const pct = Math.max(0, Math.min(100, data.fuelPercent)) + "%";
        $("fuelFill").style.height = pct;
        $("fuelIndicator").style.bottom = pct; // line + label ride the fill level
        $("fuelLabel").textContent = data.fuelPercent.toFixed(2) + "%";
        // Matches the Worker's own gate — refill only accepted below 99%.
        const alreadyFull = data.fuelPercent >= 99;
        $("btnRefillLive").disabled = alreadyFull;
        $("btnRefillLive").title = alreadyFull ? "already basically full" : "";
      }
      if (data && "lastRefill" in data) {
        $("lastRefillText").textContent = formatRefillTime(
          data.lastRefill ? data.lastRefill.timestamp : pageLoadTime
        );
      }
      if (data && typeof data.viewerCount === "number") {
        // The server's viewerCount is just "tabs currently open" — only
        // meaningful as "burning now" while actually lit, so it reads 0
        // otherwise. Gated here client-side, no server change needed.
        $("viewerCountText").textContent = data.lit ? data.viewerCount : 0;
      }
    }

    // The display is driven entirely by a local clock-based simulation,
    // seeded from one real fetch on page load (and reseeded whenever an
    // action succeeds against the real backend) — not by polling /state
    // on a timer. Mirrors the Worker's exact fuel math, so it stays
    // accurate between syncs with zero ongoing network cost.
    const LOCAL_FULL_TANK_BURN_SECONDS = 900; // must match workers/spark-lighter/src/lighter.js
    const LOCAL_MAX_BURN_MULTIPLIER = 8; // must match MAX_BURN_MULTIPLIER server-side
    const localState = {
      fuelSeconds: LOCAL_FULL_TANK_BURN_SECONDS,
      lit: false,
      litAt: null,
      lastRefill: null,
      fullTankBurnSeconds: LOCAL_FULL_TANK_BURN_SECONDS,
      viewerCount: 1, // last known real count; reused for offline local math too
    };

    function localCurrentFuelSeconds(now) {
      if (!localState.lit) return localState.fuelSeconds;
      const multiplier = Math.max(1, Math.min(localState.viewerCount, LOCAL_MAX_BURN_MULTIPLIER));
      return Math.max(0, localState.fuelSeconds - ((now - localState.litAt) / 1000) * multiplier);
    }
    function localPublicState(now) {
      const fuelSeconds = localCurrentFuelSeconds(now);
      return {
        lit: localState.lit && fuelSeconds > 0,
        fuelSeconds: Math.round(fuelSeconds),
        fuelPercent: Math.round((fuelSeconds / localState.fullTankBurnSeconds) * 10000) / 100,
        fullTankBurnSeconds: localState.fullTankBurnSeconds,
        lastRefill: localState.lastRefill,
        viewerCount: localState.viewerCount,
        serverTime: now,
      };
    }
    // Local mutations, used only when a real action call fails (offline).
    function localHandle(path, method) {
      const now = Date.now();
      if (path === "/state") return localPublicState(now);
      if (path === "/light" && method === "POST") {
        const fuelSeconds = localCurrentFuelSeconds(now);
        if (fuelSeconds <= 0) {
          localState.fuelSeconds = 0; localState.lit = false; localState.litAt = null;
          return { error: "empty", ...localPublicState(now) };
        }
        if (!localState.lit) { localState.fuelSeconds = fuelSeconds; localState.lit = true; localState.litAt = now; }
        return localPublicState(now);
      }
      if (path === "/extinguish" && method === "POST") {
        if (localState.lit) { localState.fuelSeconds = localCurrentFuelSeconds(now); localState.lit = false; localState.litAt = null; }
        return localPublicState(now);
      }
      if (path === "/refill" && method === "POST") {
        // Top-ups allowed below 99% — just not when already basically full.
        const fuelSeconds = localCurrentFuelSeconds(now);
        const fuelPercent = (fuelSeconds / localState.fullTankBurnSeconds) * 100;
        if (fuelPercent >= 99) return { error: "already_full", ...localPublicState(now) };
        localState.fuelSeconds = localState.fullTankBurnSeconds;
        localState.lit = false;
        localState.litAt = null;
        localState.lastRefill = { timestamp: now, city: "local", region: null, country: null };
        return localPublicState(now);
      }
      return { error: "not_found" };
    }
    // Re-anchor the local clock to a real, authoritative response — the
    // server's fuelSeconds is "as of" its own serverTime, so we treat our
    // own Date.now() right now as that same instant going forward.
    function seedFromServer(data) {
      localState.fullTankBurnSeconds = data.fullTankBurnSeconds || LOCAL_FULL_TANK_BURN_SECONDS;
      localState.fuelSeconds = data.fuelSeconds;
      localState.lit = data.lit;
      localState.litAt = data.lit ? Date.now() : null;
      localState.lastRefill = data.lastRefill;
      if (typeof data.viewerCount === "number") localState.viewerCount = data.viewerCount;
    }

    async function call(path, method = "GET") {
      try {
        const sep = path.includes("?") ? "&" : "?";
        const res = await fetch(base() + path + sep + "v=" + viewerId, { method });
        const data = await res.json();
        $("offlineNote").hidden = true;
        seedFromServer(data);
        render({ status: res.status, ...data });
        return data;
      } catch (err) {
        $("offlineNote").hidden = false;
        const data = localHandle(path, method);
        render(data);
        return data;
      }
    }

    // Ticks the display from the local simulation only — no network call.
    // 100ms so the two-decimal percentage visibly moves by ~0.01 each
    // step (900s tank ≈ 9s per whole percent, so 0.01% every ~90ms).
    setInterval(() => render(localPublicState(Date.now())), 100);

    $("btnState").onclick = () => call("/state");
    $("btnLight").onclick = () => call("/light", "POST");
    $("btnExtinguish").onclick = () => call("/extinguish", "POST");
    $("btnRefill").onclick = () => call("/refill", "POST");
    // Clicking doesn't hit the server immediately — the bar visibly fills
    // to the top first (owning the bar while refillPending, see render()
    // above), and the real request only fires once that completes.
    // Blunts spam-clicking: repeat clicks during the animation are
    // ignored outright, so it fires exactly once.
    const REFILL_ANIMATION_MS = 1250;
    let refillPending = false;
    $("btnRefillLive").onclick = () => {
      if (refillPending) return;
      refillPending = true;
      const btn = $("btnRefillLive");
      const originalText = btn.textContent;
      // Explicitly drop focus before disabling/relabeling — otherwise
      // mobile Safari can keep re-evaluating its zoom-to-focused-control
      // heuristic as the button's disabled state and text keep changing
      // for the next ~1.25s, making the zoom creep further in over time.
      btn.blur();
      btn.disabled = true;
      btn.textContent = "refilling...";

      // Driven by JS, not a CSS transition, so the percentage label can
      // tick up in step with the bar instead of sitting frozen/stale
      // until the server responds.
      const startPercent = Math.max(0, Math.min(100, parseFloat($("fuelLabel").textContent) || 0));
      const startTime = Date.now();
      const tween = setInterval(() => {
        const fraction = Math.min(1, (Date.now() - startTime) / REFILL_ANIMATION_MS);
        const pct = startPercent + (100 - startPercent) * fraction;
        $("fuelFill").style.height = pct + "%";
        $("fuelIndicator").style.bottom = pct + "%";
        $("fuelLabel").textContent = pct.toFixed(2) + "%";
        if (fraction >= 1) {
          clearInterval(tween);
          // refillPending stays true until the request actually resolves
          // — clearing it earlier would let the ticker flash the bar
          // back down to the stale pre-refill percent for a tick or two.
          call("/refill", "POST").finally(() => {
            refillPending = false;
            btn.disabled = false;
            btn.textContent = originalText;
          });
        }
      }, 100);
    };

    // Real fetch on load, then every 15s to catch up with other visitors'
    // actions — the 100ms ticker in between still comes from local math,
    // not the network, so this is 4 requests/min per open tab, not 600.
    call("/state");
    setInterval(() => call("/state"), 15000);

    function playLidSwing(name) {
      const lid = $("lidImg");
      const hinge = $("hingeImg");
      // Opening: slow start, fast finish (ease-in). Closing: fast start,
      // slow finish (ease-out) — the reverse feel, not just reversed keyframes.
      const easing = name === "lid-swing-open" ? "ease-in" : "ease-out";
      const hingeAnim = name === "lid-swing-open" ? "hinge-reveal-open" : "hinge-reveal-close";
      lid.style.animation = "none";
      hinge.style.animation = "none";
      void lid.offsetWidth; // force reflow so the restart actually takes
      lid.style.animation = `${name} 0.45s ${easing} forwards`;
      // Same duration/easing as the lid so "20%"/"50%" line up with the
      // lid's actual time-through-animation, not just wall-clock guessing.
      hinge.style.animation = `${hingeAnim} 0.45s ${easing} forwards`;
    }

    // Open/close is purely the lid mechanic (matches a real Zippo: flipping
    // the lid open doesn't light it, you still have to strike the wheel).
    // Closing *does* smother any active flame, so it also extinguishes.
    $("openTarget").addEventListener("click", () => {
      console.log("[spark] open target clicked, isOpen:", isOpen);
      if (isOpen) return;
      isOpen = true;
      $("lighter").classList.add("is-open");
      playLidSwing("lid-swing-open");
    });
    $("closeTarget").addEventListener("click", () => {
      console.log("[spark] close target clicked, isOpen:", isOpen);
      if (!isOpen) return;
      isOpen = false;
      $("lighter").classList.remove("is-open");
      playLidSwing("lid-swing-close");
      // Stop the flame immediately client-side rather than waiting up to
      // 1s for the next /state poll to come back with lit:false.
      stopFlameFlicker();
      call("/extinguish", "POST");
    });

    // Diagnostic: logs exactly what element received a click anywhere on
    // the lighter, so a "nothing's clickable" report is easy to pin down
    // (safe to remove once the real UI is settled).
    $("lighter").addEventListener("click", (e) => {
      console.log("[spark] lighter click target:", e.target.id || e.target.tagName, "at", e.offsetX, e.offsetY);
    });

    // Striking the wheel: press on it and swipe down past a threshold to
    // light. Gated by isOpen since the wheel's only reachable once open.
    const wheelTarget = $("wheelTarget");
    const SWIPE_DOWN_FRACTION = 0.06; // of the lighter's rendered height
    let swipeStartY = null;

    wheelTarget.addEventListener("pointerdown", (e) => {
      if (!isOpen) return;
      swipeStartY = e.clientY;
      wheelTarget.setPointerCapture(e.pointerId);
    });
    wheelTarget.addEventListener("pointerup", (e) => {
      if (swipeStartY === null) return;
      const deltaY = e.clientY - swipeStartY;
      swipeStartY = null;
      const threshold = $("lighter").getBoundingClientRect().height * SWIPE_DOWN_FRACTION;
      console.log("[spark] wheel swipe deltaY:", deltaY, "threshold:", threshold);
      if (deltaY > threshold) call("/light", "POST");
    });
    wheelTarget.addEventListener("pointercancel", () => {
      swipeStartY = null;
    });
  </script>
</body>
</html>

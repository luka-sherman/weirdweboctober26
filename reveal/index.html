<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Looka | Reveal a reveal</title>
<meta name="description" content="Scratch off">
<link rel="preload" as="fetch" href="https://octothorp.es/?uri=https://looka.click/weirdweboctober26/reveal/">
<link rel="octo:octothorpes" href="weirdweboctober">
<link rel="octo:octothorpes" href="Reveal">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #000;
    font-size: 16px; /* fixes 1em = 16px for the grid, independent of
      any device/browser default so the tiling stays predictable */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none; /* iOS: no long-press callout/menu while scratching */
  }
  #stage {
    position: fixed;
    inset: 0;
    touch-action: none; /* swiping scratches tiles, it never scrolls/zooms */
    -webkit-user-select: none;
    user-select: none;
  }
  #image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }
  @media (max-width: 700px) {
    /* portrait/mobile: favor the left side of the image (where Vader is)
       but trim the outermost eighth of it rather than hard-cropping at
       the very edge */
    #image { object-position: 20% center; }
  }
  #grid {
    position: absolute;
    top: 0;
    left: 0;
    display: grid;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .cell {
    width: 1em;
    height: 1em;
    background: #000;
    opacity: 1;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .cell.revealed { opacity: 0; }
</style>
</head>
<body>
  <div id="stage">
    <img id="image" src="assets/image.webp" alt="Darth Vader reaching toward Luke Skywalker over the Cloud City gantry, The Empire Strikes Back.">
    <div id="grid"></div>
  </div>
  <script src="../shared/home-button.js"></script>
  <script>
    // "1st: Reveal" badge immediately after "weird web october", same
    // font/size. Page-specific — doesn't touch shared/home-button.js,
    // which every other day page also uses as-is.
    function addDayBadge() {
      var homeLink = document.querySelector(".weird-web-home");
      if (!homeLink) return;
      var wrap = document.createElement("div");
      wrap.style.cssText = "position:fixed; top:1rem; left:1rem; display:flex; align-items:baseline; gap:0.5rem; z-index:1000;";
      homeLink.parentNode.insertBefore(wrap, homeLink);
      homeLink.style.position = "static"; // now flows inside wrap instead of its own fixed position
      wrap.appendChild(homeLink);
      var badge = document.createElement("span");
      badge.textContent = "1st: Reveal";
      badge.style.cssText = 'font-family:"Creepster", cursive; font-size:clamp(1rem, 2.5vw, 1.4rem); color:#eee; letter-spacing:0.02em; opacity:0.85;';
      wrap.appendChild(badge);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", addDayBadge);
    } else {
      addDayBadge();
    }
  </script>
  <script>
    (function () {
      var grid = document.getElementById('grid');
      var emPx = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
      var cells = [];
      var cols = 0, rows = 0;

      function buildGrid() {
        cols = Math.ceil(window.innerWidth / emPx);
        rows = Math.ceil(window.innerHeight / emPx);
        grid.style.width = (cols * emPx) + 'px';
        grid.style.height = (rows * emPx) + 'px';
        grid.style.gridTemplateColumns = 'repeat(' + cols + ', ' + emPx + 'px)';
        grid.style.gridTemplateRows = 'repeat(' + rows + ', ' + emPx + 'px)';

        grid.innerHTML = '';
        cells = new Array(cols * rows);
        var frag = document.createDocumentFragment();
        for (var i = 0; i < cells.length; i++) {
          var cell = document.createElement('div');
          cell.className = 'cell';
          cells[i] = cell;
          frag.appendChild(cell);
        }
        grid.appendChild(frag);
      }

      function revealAt(x, y) {
        var col = Math.floor(x / emPx);
        var row = Math.floor(y / emPx);
        if (col < 0 || row < 0 || col >= cols || row >= rows) return;
        var cell = cells[row * cols + col];
        if (cell) cell.classList.add('revealed');
      }

      var lastX = null, lastY = null;

      function revealLine(x, y) {
        if (lastX === null) {
          revealAt(x, y);
        } else {
          var dx = x - lastX, dy = y - lastY;
          var dist = Math.hypot(dx, dy);
          var steps = Math.max(1, Math.ceil(dist / (emPx / 2)));
          for (var i = 1; i <= steps; i++) {
            var t = i / steps;
            revealAt(lastX + dx * t, lastY + dy * t);
          }
        }
        lastX = x;
        lastY = y;
      }

      function onPointerMove(e) {
        var events = (typeof e.getCoalescedEvents === 'function') ? e.getCoalescedEvents() : null;
        if (!events || events.length === 0) events = [e];
        for (var i = 0; i < events.length; i++) {
          revealLine(events[i].clientX, events[i].clientY);
        }
      }

      function onPointerUp() {
        lastX = null;
        lastY = null;
      }

      var resizeTimer;
      function onResize() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(buildGrid, 150);
      }

      buildGrid();
      window.addEventListener('pointerdown', onPointerMove);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('resize', onResize);
    })();
  </script>
</body>
</html>
